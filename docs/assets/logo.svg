<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Agent OS Logo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bg)"/>
  <!-- Connection lines -->
  <line x1="60" y1="36" x2="36" y2="76" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="36" x2="84" y2="76" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
  <line x1="36" y1="76" x2="84" y2="76" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
  <!-- Top Leader Node -->
  <circle cx="60" cy="36" r="13" fill="url(#node)"/>
  <circle cx="60" cy="36" r="5" fill="#2563eb"/>
  <!-- Bottom Left Node -->
  <circle cx="36" cy="76" r="11" fill="url(#node)"/>
  <circle cx="36" cy="76" r="4" fill="#4f46e5"/>
  <!-- Bottom Right Node -->
  <circle cx="84" cy="76" r="11" fill="url(#node)"/>
  <circle cx="84" cy="76" r="4" fill="#059669"/>
</svg>
