<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" role="img" aria-label="多角色协作双通道编排图">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
      .title { font-size: 19px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 12.5px; fill: #64748b; }
      .box-title { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .box-sub { font-size: 11.5px; fill: #475569; }
      .step { font-size: 11.5px; font-weight: 600; fill: #1e293b; }
      .tag { font-size: 11px; font-weight: 700; }
    </style>
    <filter id="s" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1040" height="500" rx="16" fill="#f8fafc"/>
  <rect x="1" y="1" width="1038" height="498" rx="15" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="32" y="38" class="font title">多角色团队协作：内存信箱 + 飞书 @ 通知双通道设计</text>
  <text x="32" y="60" class="font sub">既让群里的用户全程可见每个派单与回传，又通过 12 位任务编号安全传递 workspaceDir / ownerOpenId / round 元数据</text>

  <!-- Left: CEO Assistant -->
  <g filter="url(#s)">
    <rect x="34" y="102" width="214" height="162" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="50" y="116" width="96" height="22" rx="6" fill="#dbeafe"/>
    <text x="60" y="131" class="font tag" fill="#1d4ed8">Team Leader</text>
    <text x="50" y="160" class="font box-title">CEO 助理 Bot</text>
    <text x="50" y="182" class="font box-sub">• 唯一允许调用 dispatch_task</text>
    <text x="50" y="201" class="font box-sub">• 指定 targetBotId、目标、要求</text>
    <text x="50" y="220" class="font box-sub">• 收到成员回传后决定继续派</text>
    <text x="50" y="239" class="font box-sub">  下一步或向用户汇总交付</text>
  </g>

  <!-- Middle Top: CollaborationInbox (Memory Channel) -->
  <g filter="url(#s)">
    <rect x="336" y="92" width="356" height="128" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="352" y="105" width="194" height="22" rx="6" fill="#fef3c7"/>
    <text x="362" y="120" class="font tag" fill="#92400e">通道 1 · 内存信箱 (可靠元数据)</text>
    <text x="352" y="147" class="mono box-title" fill="#78350f">CollaborationInbox [dispatchId]</text>
    <text x="352" y="169" class="mono box-sub">taskId · ownerOpenId · workspaceDir</text>
    <text x="352" y="187" class="mono box-sub">fromBotId · toBotId · reportToBotId · round/max</text>
    <text x="352" y="206" class="font box-sub" fill="#b45309">• consume() 一次性消费 + turnKey 防重放</text>
  </g>

  <!-- Middle Bottom: Feishu Group (Visible Channel) -->
  <g filter="url(#s)">
    <rect x="336" y="246" width="356" height="118" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="352" y="259" width="212" height="22" rx="6" fill="#eff6ff"/>
    <text x="362" y="274" class="font tag" fill="#1d4ed8">通道 2 · 飞书话题群 (人类可观测)</text>
    <text x="352" y="301" class="font box-title">CollaborationService.dispatch()</text>
    <text x="352" y="322" class="font box-sub">1. 发送协作卡片 (目标 / 要求 / 轮次 / 工作区)</text>
    <text x="352" y="341" class="font box-sub">2. 回复 post 消息 @目标Bot，附带「任务编号：a1b2c3d4e5f6」</text>
  </g>

  <!-- Right: Target Bot (Developer / Product / Reviewer / Tester) -->
  <g filter="url(#s)">
    <rect x="780" y="102" width="226" height="262" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
    <rect x="796" y="116" width="114" height="22" rx="6" fill="#d1fae5"/>
    <text x="806" y="131" class="font tag" fill="#065f46">团队执行成员</text>
    <text x="796" y="160" class="font box-title">产品 / 开发 / 审查 / 测试</text>
    <text x="796" y="185" class="font box-sub">① 正则提取 12 位任务编号</text>
    <text x="796" y="205" class="font box-sub">② consume() 取出完整元数据</text>
    <text x="796" y="225" class="font box-sub">③ 若 Session 正忙：放回信箱</text>
    <text x="796" y="243" class="font box-sub">   延迟 1s 自动排队重试</text>
    <text x="796" y="263" class="font box-sub">④ 校验/继承 workspaceDir</text>
    <text x="796" y="281" class="font box-sub">   目录不一致直接拒绝执行</text>
    <text x="796" y="303" class="font box-sub">⑤ 执行 CLI 完成本角色职责</text>
    <text x="796" y="323" class="font box-sub">⑥ 完成后自动调用</text>
    <text x="796" y="341" class="mono box-sub" fill="#047857">returnCollaborationResult()</text>
  </g>

  <!-- Bottom Safety Note Bar -->
  <rect x="34" y="400" width="972" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="52" y="426" class="font box-title">安全防线与特殊联动</text>
  <text x="52" y="448" class="font box-sub">• 防退化：带「任务编号」但信箱里找不到（已消费或重启丢失）直接丢弃，绝不退化成外部新任务   • 轮次保护：round &gt;= maxRounds 停止自动派发/回传</text>
  <text x="52" y="464" class="font box-sub">• 产品方案特例：产品经理调用 request_spec_approval 后暂不回传，等用户在确认卡点击「确认方案」后再自动交回 CEO 助理推进开发</text>

  <!-- Arrows -->
  <!-- CEO -> Inbox -->
  <path d="M 248 156 L 334 156" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#m-amber)"/>
  <text x="260" y="147" class="font step" fill="#b45309">1. register</text>

  <!-- CEO -> Feishu -->
  <path d="M 248 220 L 292 220 L 292 304 L 334 304" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#m-blue)"/>
  <text x="255" y="212" class="font step" fill="#1d4ed8">2. 发卡+@</text>

  <!-- Inbox -> Target -->
  <path d="M 692 156 L 778 156" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#m-amber)"/>
  <text x="703" y="147" class="font step" fill="#b45309">consume</text>

  <!-- Feishu -> Target -->
  <path d="M 692 304 L 778 304" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#m-blue)"/>
  <text x="704" y="295" class="font step" fill="#1d4ed8">WS 推送</text>

  <!-- Return loop: Target -> CEO -->
  <path d="M 893 364 L 893 386 L 141 386 L 141 266" fill="none" stroke="#059669" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#m-emerald)"/>
  <rect x="406" y="375" width="268" height="22" rx="11" fill="#d1fae5" stroke="#34d399"/>
  <text x="540" y="390" text-anchor="middle" class="font tag" fill="#065f46">自动回传给 reportToBotId (round + 1)</text>
</svg>
