<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="1040" height="540" role="img" aria-label="双引擎 MCP 工具拦截与进程接管机制">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
      .title { font-size: 19px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 12.5px; fill: #64748b; }
      .actor { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .step { font-size: 12px; font-weight: 600; fill: #1e293b; }
      .note { font-size: 11.5px; fill: #475569; }
      .tag { font-size: 11px; font-weight: 700; }
    </style>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1040" height="540" rx="16" fill="#f8fafc"/>
  <rect x="1" y="1" width="1038" height="538" rx="15" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="32" y="38" class="font title">核心机制：为什么调用交互工具要立刻 killCli 交由 OS 接管？</text>
  <text x="32" y="60" class="font sub">对比两种 MCP 工具路径：5 个异步交互工具走「拦截杀进程 + 卡片续接」，schedule_manage 走「本地 HTTP 同步返回」</text>

  <!-- Lane Headers -->
  <rect x="44" y="80" width="180" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="134" y="106" text-anchor="middle" class="font actor" fill="#1e3a8a">Agent OS (runCli)</text>

  <rect x="314" y="80" width="210" height="42" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="419" y="106" text-anchor="middle" class="font actor" fill="#312e81">Claude / Codex 子进程</text>

  <rect x="614" y="80" width="186" height="42" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="707" y="106" text-anchor="middle" class="font actor" fill="#9f1239">app-tools-server (MCP)</text>

  <rect x="854" y="80" width="150" height="42" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="929" y="106" text-anchor="middle" class="font actor" fill="#92400e">飞书 / 本地 API</text>

  <!-- Lifelines -->
  <line x1="134" y1="122" x2="134" y2="516" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="419" y1="122" x2="419" y2="516" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="707" y1="122" x2="707" y2="516" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="929" y1="122" x2="929" y2="516" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Section A: Async Interactive Tool Interception -->
  <rect x="24" y="138" width="992" height="236" rx="12" fill="#ffffff" fill-opacity="0.78" stroke="#fecdd3" stroke-width="1.5"/>
  <rect x="36" y="148" width="376" height="24" rx="6" fill="#ffe4e6"/>
  <text x="46" y="164" class="font tag" fill="#be123c">路径 A · 异步控制工具（拦截即杀进程，不空等人类操作）</text>
  <text x="424" y="164" class="mono note" fill="#9f1239">select_workspace · request_clarification · request_spec_approval · request_approval · dispatch_task</text>

  <!-- Step 1 -->
  <line x1="134" y1="196" x2="412" y2="196" stroke="#334155" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="150" y="189" class="font step">1. spawnCli 注入 MCP 配置与会话环境变量，监听 stdout JSONL</text>

  <!-- Step 2 -->
  <line x1="419" y1="228" x2="142" y2="228" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-red)"/>
  <text x="152" y="221" class="font step" fill="#b91c1c">2. 输出 tool_call 事件（适配器已归一化工具名，并已缓存 observedSessionId）</text>

  <!-- Step 3 -->
  <rect x="44" y="242" width="180" height="46" rx="8" fill="#fef2f2" stroke="#f87171"/>
  <text x="56" y="261" class="font tag" fill="#991b1b">3. runCli 命中拦截名单！</text>
  <text x="56" y="279" class="mono note" fill="#b91c1c">stoppedByToolCall = call</text>

  <line x1="224" y1="265" x2="412" y2="265" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="238" y="258" class="font step" fill="#dc2626">4. 立即 killCli(child) 终止进程树</text>

  <rect x="404" y="253" width="30" height="24" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="419" y="270" text-anchor="middle" class="font tag" fill="#b91c1c">✕</text>

  <!-- Step 5 -->
  <line x1="134" y1="316" x2="922" y2="316" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <text x="150" y="309" class="font step" fill="#1d4ed8">5. close 时按正常中断 resolve → task-result.ts 发飞书交互卡片，Session 释放为 idle</text>

  <!-- Step 6 -->
  <line x1="929" y1="352" x2="142" y2="352" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <text x="150" y="345" class="font step" fill="#1d4ed8">6. 几分钟后用户点击卡片确认 → OS 用保存的 cliSessionId 发起 --resume 无缝续接！</text>

  <!-- Section B: Sync Schedule Tool -->
  <rect x="24" y="388" width="992" height="126" rx="12" fill="#ffffff" fill-opacity="0.82" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="36" y="398" width="306" height="24" rx="6" fill="#fef3c7"/>
  <text x="46" y="414" class="font tag" fill="#b45309">路径 B · 同步管理工具（不中断 CLI，同一轮内完成）</text>
  <text x="356" y="414" class="mono note" fill="#92400e">schedule_manage (list / add / update / remove / run / logs ...)</text>

  <line x1="419" y1="446" x2="699" y2="446" stroke="#334155" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="436" y="439" class="font step">1. CLI 通过 stdio 调用 schedule_manage</text>

  <line x1="707" y1="468" x2="921" y2="468" stroke="#d97706" stroke-width="2.2" marker-end="url(#arr-amber)"/>
  <text x="720" y="461" class="font step" fill="#b45309">2. HTTP POST :3101/api/schedules/manage</text>

  <line x1="929" y1="494" x2="427" y2="494" stroke="#d97706" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-amber)"/>
  <text x="436" y="487" class="font step" fill="#92400e">3. 落盘并挂上定时器 → 同步返回结果文本，CLI 继续输出最终回复</text>
</svg>
