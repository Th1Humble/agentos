<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <title>Agent OS 源码学习手册</title>
  <meta name="description" content="Agent OS 架构解析与源码学习 Wiki：结合代码掌握飞书多角色 AI 团队协作系统。">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #2563eb;
      --sidebar-width: 280px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    .sidebar-nav > ul > li > p {
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 4px;
      color: #1e293b;
      font-size: 0.92rem;
    }
    .markdown-section {
      max-width: 900px;
      padding: 32px 24px 64px;
    }
    .markdown-section h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .markdown-section h2 {
      margin-top: 2.2rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid #e2e8f0;
    }
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
      background: #f8fafc;
      padding: 12px 16px;
      border-radius: 0 6px 6px 0;
      color: #334155;
    }
    .markdown-section code {
      font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, monospace;
      font-size: 0.88em;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
    .markdown-section img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      margin: 16px 0;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }
    .mermaid {
      margin: 20px 0;
      text-align: center;
    }
    section.cover {
      background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 55%, #eef2ff 100%) !important;
    }
    section.cover .cover-main {
      max-width: 760px;
    }
    section.cover .cover-main img {
      width: 96px;
      height: 96px;
      margin-bottom: 12px;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.18);
      border-radius: 24px;
    }
    section.cover h1 {
      font-weight: 800;
      color: #0f172a;
    }
    section.cover blockquote {
      color: #475569;
      font-size: 1.15rem;
    }
    section.cover ul {
      text-align: left;
      max-width: 560px;
      margin: 18px auto 24px;
      color: #334155;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div id="app">正在加载 Agent OS 源码学习手册...</div>

  <script>
    window.$docsify = {
      name: 'Agent OS 学习手册',
      repo: 'Th1Humble/agentos',
      coverpage: true,
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      relativePath: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档、函数名、模块...',
        noData: '没有找到匹配内容',
        depth: 4
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },
      pagination: {
        previousText: '上一章',
        nextText: '下一章',
        crossChapter: true,
        crossChapterText: true
      },
      mermaidConfig: {
        querySelector: '.mermaid'
      }
    };
  </script>

  <!-- Docsify 核心 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- 全文搜索 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- 代码一键复制 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <!-- 上一章 / 下一章 -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <!-- 图片点击放大 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <!-- 语法高亮 -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <!-- Mermaid 流程图渲染 -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
    window.mermaid = mermaid;
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
</body>
</html>
